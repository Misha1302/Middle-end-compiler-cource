site_name: Middle-end Compiler Course
site_description: Самостоятельный практический курс по CFG, dominance, SSA и оптимизациям middle-end
repo_url: https://github.com/Misha1302/Middle-end-compiler-cource
repo_name: Misha1302/Middle-end-compiler-cource
site_url: https://misha1302.github.io/Middle-end-compiler-cource/

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Как проходить: getting-started.md
  - Обязательные предпосылки: prerequisites.md
  - Карта курса: course-map.md
  - Контракт учебного IR: ir-contract.md
  - Занятия:
      - "1. Путь программы через компилятор": modules/01-pipeline-and-diagnostic.md
      - "2. Лидеры и базовые блоки": modules/02-leaders-and-basic-blocks.md
      - "3. CFG и достижимость": modules/03-building-cfg.md
      - "4. Доминирование": modules/04-dominators.md
      - "5. IDom, дерево и DF": modules/05-idom-tree-and-df.md
      - "6. SSA и φ-функции": modules/06-ssa-and-phi.md
      - "7. SSA-renaming и verifier": modules/07-ssa-renaming.md
      - "8. Def-use и LVN": modules/08-dependencies-and-lvn.md
      - "9. Константы": modules/09-constants.md
      - "10. DCE и UCE": modules/10-dce-uce-and-pass-order.md
      - "11. Inlining": modules/11-inlining.md
      - "12. Комплексная работа №1": modules/12-checkpoint-1.md
      - "13. Циклы в CFG": modules/13-loop-concepts.md
      - "14. Идея Хавлака и дерево циклов": modules/14-havlak-and-loop-tree.md
      - "15. Индуктивные переменные": modules/15-induction-variables.md
      - "16. LICM": modules/16-licm.md
      - "17. Loop transformations": modules/17-loop-transformations.md
      - "18. Комплексная работа №2": modules/18-checkpoint-2.md
      - "19. Пробный зачёт": modules/19-mock-exam-1.md
      - "20. Финальный ремонт": modules/20-final-repair.md
  - Практика:
      - Банк задач на перенос: practice/transfer-bank.md
      - Рубрики проверки: practice/answers-and-rubrics.md
      - Пробный зачёт — вариант 2: practice/mock-exam-2.md
  - Ресурсы:
      - Словарь: resources/glossary.md
      - Карточки: resources/flashcards.md
  - Источники: references.md
  - Происхождение материалов: source-materials.md
  - Статус курса: course-status.md
