site_name: Middle-end Compiler Course
site_description: Практический курс по CFG, доминированию, SSA и оптимизациям middle-end
repo_url: https://github.com/Misha1302/Middle-end-compiler-course
repo_name: Misha1302/Middle-end-compiler-course
site_url: https://misha1302.github.io/Middle-end-compiler-course/

theme:

  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Как проходить курс: getting-started.md
  - Карта курса: course-map.md
  - Контракт учебного IR: ir-contract.md
  - Занятия:
      - "1. Диагностика и полный путь компиляции": modules/01-pipeline-and-diagnostic.md
      - "2. Лидеры и базовые блоки": modules/02-leaders-and-basic-blocks.md
      - "3. Построение CFG и достижимость": modules/03-building-cfg.md
      - "4. Доминирование": modules/04-dominators.md
      - "5. IDom, дерево доминаторов и DF": modules/05-idom-tree-and-df.md
      - "6. SSA и расстановка φ-функций": modules/06-ssa-and-phi.md
      - "7. SSA-переименование и проверка": modules/07-ssa-renaming.md
      - "8. Зависимости и Local Value Numbering": modules/08-dependencies-and-lvn.md
      - "9. Свёртка и распространение констант": modules/09-constants.md
      - "10. DCE, UCE и порядок проходов": modules/10-dce-uce-and-pass-order.md
      - "11. Inlining": modules/11-inlining.md
      - "12. Комплексная работа №1": modules/12-checkpoint-1.md
      - "13. Циклы в CFG": modules/13-loop-concepts.md
      - "14. Алгоритм Хавлака и дерево циклов": modules/14-havlak-and-loop-tree.md
      - "15. Индуктивные переменные и strength reduction": modules/15-induction-variables.md
      - "16. LICM": modules/16-licm.md
      - "17. Преобразования циклов": modules/17-loop-transformations.md
      - "18. Комплексная работа №2": modules/18-checkpoint-2.md
      - "19. Пробный зачёт": modules/19-mock-exam-1.md
      - "20. Финальный ремонт и карта курса": modules/20-final-repair.md
  - Практика и контроль:
      - Эталоны и критерии: practice/answers-and-rubrics.md
      - Пробный зачёт — вариант 2: practice/mock-exam-2.md
  - Справочные материалы:
      - Словарь: resources/glossary.md
      - Карточки: resources/flashcards.md
  - Источники и литература: references.md
  - Происхождение материалов: source-materials.md
  - Статус и границы курса: course-status.md
