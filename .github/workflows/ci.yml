name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
      - name: Validate course structure and links
        run: python scripts/validate_course.py
      - name: Check readability of high-impact pages
        run: python scripts/check_readability.py --strict
      - name: Validate audited content contracts
        run: python scripts/validate_content_contracts.py
      - name: Validate semantic golden examples
        run: python scripts/validate_golden_examples.py
      - name: Run teaching-tool tests
        run: python -m unittest discover -s tests -v

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: mkdocs build --strict
