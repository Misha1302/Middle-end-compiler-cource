            deploy:
              environment:
                name: github-pages
                url: __PAGES_URL__
              runs-on: ubuntu-latest
              needs: build
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          '''
          write(
              ".github/workflows/pages.yml",
              pages.replace(
                  "__PAGES_URL__",
                  chr(36) + "{{ steps.deployment.outputs.page_url }}",
              ),
          )

