name: Apply review remediation

on:
  push:
    branches: [agent/remediate-review-findings]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remediate-review-findings
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply reviewed changes
        shell: bash
        run: |
          cat > /tmp/remediate.py <<'PY'
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path.cwd()


          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + "\n", encoding="utf-8")


          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")


          write(
              "src/middle_end_course/cfg.py",
              '''from __future__ import annotations

          from dataclasses import dataclass
          from types import MappingProxyType
          from typing import Iterable, Mapping


          @dataclass(frozen=True, slots=True)
          class ControlFlowGraph:
              """A small immutable CFG intended for manual experiments and tests."""

              entry: str
              successors: Mapping[str, tuple[str, ...]]

              @classmethod
              def from_mapping(
                  cls,
                  entry: str,
                  successors: Mapping[str, Iterable[str]],
              ) -> "ControlFlowGraph":
                  normalized = {
                      node: tuple(targets)
                      for node, targets in successors.items()
                  }
                  graph = cls(
                      entry=entry,
                      successors=MappingProxyType(normalized),
                  )
                  graph.validate()
                  return graph

              @property
              def nodes(self) -> frozenset[str]:
                  return frozenset(self.successors)

              def validate(self) -> None:
                  if self.entry not in self.successors:
                      raise ValueError(f"entry node {self.entry!r} is not declared")
                  unknown = {
                      target
                      for targets in self.successors.values()
                      for target in targets
                      if target not in self.successors
                  }
                  if unknown:
                      raise ValueError(f"edges reference unknown nodes: {sorted(unknown)}")

              def predecessors(self) -> dict[str, tuple[str, ...]]:
                  result: dict[str, list[str]] = {node: [] for node in self.successors}
                  for source, targets in self.successors.items():
                      for target in targets:
                          result[target].append(source)
                  return {node: tuple(preds) for node, preds in result.items()}

              def reachable(self) -> frozenset[str]:
                  visited: set[str] = set()
                  stack = [self.entry]
                  while stack:
                      node = stack.pop()
                      if node in visited:
                          continue
                      visited.add(node)
                      stack.extend(reversed(self.successors[node]))
                  return frozenset(visited)

              def dominators(self) -> dict[str, frozenset[str]]:
                  reachable = self.reachable()
                  preds = self.predecessors()
                  dom: dict[str, set[str]] = {
                      node: ({node} if node == self.entry else set(reachable))
                      for node in reachable
                  }

                  changed = True
                  while changed:
                      changed = False
                      for node in sorted(reachable):
                          if node == self.entry:
                              continue
                          reachable_preds = [pred for pred in preds[node] if pred in reachable]
                          if not reachable_preds:
                              new_value = {node}
                          else:
                              intersection = set(dom[reachable_preds[0]])
                              for pred in reachable_preds[1:]:
                                  intersection.intersection_update(dom[pred])
                              new_value = {node} | intersection
                          if new_value != dom[node]:
                              dom[node] = new_value
                              changed = True
                  return {node: frozenset(value) for node, value in dom.items()}

              def immediate_dominators(self) -> dict[str, str | None]:
                  dom = self.dominators()
                  result: dict[str, str | None] = {self.entry: None}
                  for node in sorted(dom):
                      if node == self.entry:
                          continue
                      strict = set(dom[node]) - {node}
                      candidates = [
                          candidate
                          for candidate in strict
                          if (strict - {candidate}).issubset(dom[candidate])
                      ]
                      if len(candidates) != 1:
                          raise RuntimeError(
                              f"expected one immediate dominator for {node!r}, got {candidates}"
                          )
                      result[node] = candidates[0]
                  return result

              def dominance_frontier(self) -> dict[str, frozenset[str]]:
                  """Compute DF from its definition; intentionally simple, not optimized."""
                  dom = self.dominators()
                  preds = self.predecessors()
                  reachable = set(dom)
                  frontier: dict[str, set[str]] = {node: set() for node in reachable}

                  for x in reachable:
                      for y in reachable:
                          x_strictly_dominates_y = x in (set(dom[y]) - {y})
                          if x_strictly_dominates_y:
                              continue
                          if any(pred in reachable and x in dom[pred] for pred in preds[y]):
                              frontier[x].add(y)
                  return {node: frozenset(values) for node, values in frontier.items()}

              def natural_loop(self, header: str, latch: str) -> frozenset[str]:
                  if header not in self.nodes or latch not in self.nodes:
                      raise ValueError("header and latch must be declared nodes")

                  reachable = self.reachable()
                  if header not in reachable or latch not in reachable:
                      raise ValueError("header and latch must be reachable from entry")
                  if header not in self.successors[latch]:
                      raise ValueError(f"{latch!r} -> {header!r} is not an edge")

                  dom = self.dominators()
                  if header not in dom[latch]:
                      raise ValueError("the edge is not a back edge: header does not dominate latch")

                  preds = self.predecessors()
                  loop = {header, latch}
                  worklist = [] if header == latch else [latch]
                  while worklist:
                      node = worklist.pop()
                      for pred in preds[node]:
                          if pred not in reachable or pred in loop:
                              continue
                          loop.add(pred)
                          if pred != header:
                              worklist.append(pred)
                  return frozenset(loop)
          ''',
          )

          write(
              "tests/test_cfg.py",
              '''import unittest

          from middle_end_course.cfg import ControlFlowGraph


          class ControlFlowGraphTests(unittest.TestCase):
              def test_diamond(self) -> None:
                  graph = ControlFlowGraph.from_mapping(
                      "B0",
                      {
                          "B0": ["B1", "B2"],
                          "B1": ["B3"],
                          "B2": ["B3"],
                          "B3": [],
                          "Dead": [],
                      },
                  )

                  self.assertEqual(graph.reachable(), frozenset({"B0", "B1", "B2", "B3"}))
                  self.assertEqual(graph.dominators()["B3"], frozenset({"B0", "B3"}))
                  self.assertEqual(
                      graph.immediate_dominators(),
                      {"B0": None, "B1": "B0", "B2": "B0", "B3": "B0"},
                  )
                  frontier = graph.dominance_frontier()
                  self.assertEqual(frontier["B1"], frozenset({"B3"}))
                  self.assertEqual(frontier["B2"], frozenset({"B3"}))
                  self.assertEqual(frontier["B0"], frozenset())

              def test_natural_loop_and_self_frontier(self) -> None:
                  graph = ControlFlowGraph.from_mapping(
                      "B0",
                      {
                          "B0": ["B1"],
                          "B1": ["B2", "B4"],
                          "B2": ["B3"],
                          "B3": ["B1"],
                          "B4": [],
                      },
                  )
                  self.assertEqual(graph.natural_loop("B1", "B3"), frozenset({"B1", "B2", "B3"}))
                  frontier = graph.dominance_frontier()
                  self.assertEqual(frontier["B1"], frozenset({"B1"}))
                  self.assertEqual(frontier["B2"], frozenset({"B1"}))
                  self.assertEqual(frontier["B3"], frozenset({"B1"}))

              def test_self_loop_does_not_capture_preheader(self) -> None:
                  graph = ControlFlowGraph.from_mapping(
                      "Entry",
                      {
                          "Entry": ["Header"],
                          "Header": ["Header", "Exit"],
                          "Exit": [],
                      },
                  )
                  self.assertEqual(graph.natural_loop("Header", "Header"), frozenset({"Header"}))

              def test_natural_loop_ignores_unreachable_predecessors(self) -> None:
                  graph = ControlFlowGraph.from_mapping(
                      "Entry",
                      {
                          "Entry": ["Header"],
                          "Header": ["Body", "Exit"],
                          "Body": ["Latch"],
                          "Latch": ["Header"],
                          "Exit": [],
                          "Dead": ["Body"],
                      },
                  )
                  self.assertEqual(
                      graph.natural_loop("Header", "Latch"),
                      frozenset({"Header", "Body", "Latch"}),
                  )

              def test_graph_copies_and_freezes_successors(self) -> None:
                  source = {"B0": ["B1"], "B1": []}
                  graph = ControlFlowGraph.from_mapping("B0", source)

                  source["B0"].append("B0")
                  source["B2"] = []
                  self.assertEqual(graph.successors["B0"], ("B1",))
                  self.assertNotIn("B2", graph.nodes)
                  with self.assertRaises(TypeError):
                      graph.successors["B0"] = ()  # type: ignore[index]

              def test_rejects_unknown_target(self) -> None:
                  with self.assertRaisesRegex(ValueError, "unknown nodes"):
                      ControlFlowGraph.from_mapping("B0", {"B0": ["B1"]})

              def test_rejects_non_back_edge_for_natural_loop(self) -> None:
                  graph = ControlFlowGraph.from_mapping("B0", {"B0": ["B1"], "B1": []})
                  with self.assertRaisesRegex(ValueError, "not an edge"):
                      graph.natural_loop("B0", "B1")

              def test_rejects_unreachable_loop_edge(self) -> None:
                  graph = ControlFlowGraph.from_mapping(
                      "B0",
                      {"B0": [], "Dead": ["Dead"]},
                  )
                  with self.assertRaisesRegex(ValueError, "reachable"):
                      graph.natural_loop("Dead", "Dead")


          if __name__ == "__main__":
              unittest.main()
          ''',
          )

          write(
              "scripts/validate_course.py",
              '''from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          DOCS = ROOT / "docs"

          REQUIRED = [
              ROOT / "README.md",
              ROOT / "mkdocs.yml",
              ROOT / "LICENSE",
              ROOT / "LICENSE-CODE",
              ROOT / "LICENSE-DOCS.md",
              DOCS / "index.md",
              DOCS / "course-map.md",
              DOCS / "ir-contract.md",
              DOCS / "practice/answers-and-rubrics.md",
          ]

          REQUIRED_CONTENT = {
              DOCS / "ir-contract.md": (
                  "`readonly` запрещает запись, но разрешает чтение памяти",
              ),
              DOCS / "modules/05-idom-tree-and-df.md": (
                  "который доминируется всеми остальными строгими доминаторами",
              ),
              DOCS / "modules/16-licm.md": (
                  "Доказано ли, что раннее выполнение не породит исключение/ошибку",
              ),
          }

          LINK_PATTERN = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          HTML_SRC_PATTERN = re.compile(r"<(?:img|a)\b[^>]*(?:src|href)=['\"]([^'\"]+)['\"]", re.I)
          FORBIDDEN = [
              "/mnt/data/",
              "../assets/diagrams/",
              "Что прислать мне",
              "Когда обращаться ко мне",
              "У Дмитрия",
              "у Дмитрия",
              "Работа со мной",
              "разбор со мной",
              "Разобрать со мной",
              "прислать попытку",
              "до получения канонической статьи",
              "статья Дмитрия",
              "статьи Дмитрия",
              "3–9 августа",
              "15–24 июля",
              "Резерв: 2–6 августа",
              "не доминируемый другим строгим доминатором",
              "Может ли раннее выполнение породить исключение/ошибку",
              "пометке pure/readonly",
          ]


          def is_within_repository(path: Path) -> bool:
              try:
                  path.relative_to(ROOT)
              except ValueError:
                  return False
              return True


          def validate_links(path: Path, text: str, errors: list[str]) -> None:
              links = LINK_PATTERN.findall(text) + HTML_SRC_PATTERN.findall(text)
              for link in links:
                  target = link.strip().split("#", 1)[0]
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  resolved = (path.parent / target).resolve()
                  if not is_within_repository(resolved):
                      errors.append(
                          f"{path.relative_to(ROOT)}: local target escapes repository: {link}"
                      )
                      continue
                  if not resolved.exists():
                      errors.append(f"{path.relative_to(ROOT)}: missing local target {link}")


          def main() -> int:
              errors: list[str] = []
              for path in REQUIRED:
                  if not path.exists():
                      errors.append(f"missing required file: {path.relative_to(ROOT)}")

              modules = sorted((DOCS / "modules").glob("*.md"))
              if len(modules) != 20:
                  errors.append(f"expected 20 modules, found {len(modules)}")

              for index, path in enumerate(modules, start=1):
                  text = path.read_text(encoding="utf-8")
                  if not text.startswith(f"# Занятие {index}."):
                      errors.append(f"{path.relative_to(ROOT)}: incorrect top-level title")
                  for marker in (
                      "Сначала простыми словами",
                      "Обязательная практика",
                      "Три вопроса",
                      "```mermaid",
                  ):
                      if marker not in text:
                          errors.append(f"{path.relative_to(ROOT)}: missing section {marker!r}")

              for path, snippets in REQUIRED_CONTENT.items():
                  if not path.exists():
                      continue
                  text = path.read_text(encoding="utf-8")
                  for snippet in snippets:
                      if snippet not in text:
                          errors.append(
                              f"{path.relative_to(ROOT)}: missing correctness regression marker {snippet!r}"
                          )

              for path in [ROOT / "README.md", *DOCS.rglob("*.md")]:
                  text = path.read_text(encoding="utf-8")
                  for forbidden in FORBIDDEN:
                      if forbidden in text:
                          errors.append(
                              f"{path.relative_to(ROOT)}: forbidden source-specific or incorrect text {forbidden!r}"
                          )
                  if re.search(r"(?m)^\d+\.\s+\d+\\\.\s+", text):
                      errors.append(f"{path.relative_to(ROOT)}: duplicated ordered-list numbering")
                  validate_links(path, text, errors)

              if errors:
                  print("Course validation failed:", file=sys.stderr)
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  return 1
              print(f"Course validation passed: {len(modules)} modules and all local links resolved")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          ''',
          )

          write(
              "tests/test_course_validator.py",
              '''from __future__ import annotations

          import importlib.util
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SPEC = importlib.util.spec_from_file_location(
              "course_validator",
              ROOT / "scripts/validate_course.py",
          )
          if SPEC is None or SPEC.loader is None:
              raise RuntimeError("could not load course validator")
          VALIDATOR = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(VALIDATOR)


          class CourseValidatorTests(unittest.TestCase):
              def test_repository_boundary(self) -> None:
                  self.assertTrue(
                      VALIDATOR.is_within_repository((ROOT / "docs/index.md").resolve())
                  )
                  self.assertFalse(
                      VALIDATOR.is_within_repository(Path("/etc/passwd").resolve())
                  )

              def test_escaping_link_is_rejected(self) -> None:
                  errors: list[str] = []
                  VALIDATOR.validate_links(
                      ROOT / "docs/index.md",
                      "[escape](../../../../etc/passwd)",
                      errors,
                  )
                  self.assertEqual(len(errors), 1)
                  self.assertIn("escapes repository", errors[0])


          if __name__ == "__main__":
              unittest.main()
          ''',
          )

          write(
              "docs/ir-contract.md",
              '''# Единый контракт учебного IR

          Все задачи курса опираются на один контракт. Если конкретное условие явно задаёт другую семантику, оно имеет приоритет.

          1. У каждого базового блока ровно один терминатор; терминатор — последняя инструкция блока.
          2. Обычные целочисленные `add/sub/mul` считаются чистыми и математическими, если отдельно не указаны разрядность, переполнение или флаги.
          3. Деление может завершиться наблюдаемой ошибкой при нуле. Его нельзя безусловно удалять или выносить без доказательства безопасности и допустимости спекуляции.
          4. `print`, `store`, `volatile/atomic` и неизвестный вызов имеют наблюдаемый эффект. Пометка `pure` означает отсутствие чтения/записи памяти и иных наблюдаемых эффектов по контракту; возможность исключений и безопасность спекуляции проверяются отдельно.
          5. Пометка `readonly` запрещает запись, но разрешает чтение памяти и сама по себе не делает вызов чистым. Такой вызов нельзя объединять или переносить через потенциальную запись без alias/effect-фактов либо версии памяти.
          6. Обычный `load` нельзя объединять через потенциальный `store`, `readonly`-вызов с пересекающимся чтением или неизвестный вызов без alias/effect-фактов. Загрузки из явно корректного массива в границах считаются не бросающими исключение.
          7. Все φ-функции стоят в начале блока. Для каждого непосредственного predecessor существует ровно один подписанный вход; использование incoming-value концептуально происходит на соответствующем ребре.
          8. После изменения CFG необходимо обновить `pred/succ`, достижимость, входы φ и зависимые анализы, затем снова проверить SSA-инварианты.
          9. Под «графом зависимостей» по умолчанию понимается SSA def-use/data-dependence graph. Memory и control dependencies требуют отдельной модели.

          ## Обязательные верификаторы после мутации

          - каждое target/fall-through ребро соответствует терминатору;
          - `v ∈ succ(u)` тогда и только тогда, когда `u ∈ pred(v)`;
          - количество и подписи входов φ совпадают с непосредственными predecessors;
          - каждое SSA-использование доминируется своим определением с учётом edge-use для φ;
          - инвалидированные анализы пересчитаны до следующего прохода.
          ''',
          )

          replace_once(
              "docs/modules/05-idom-tree-and-df.md",
              "6.  Для n≠entry выбрать строгий доминатор, не доминируемый другим строгим доминатором n: это idom(n).",
              "6.  Для n≠entry выбрать строгий доминатор d, который доминируется всеми остальными строгими доминаторами n: это idom(n).",
          )
          replace_once(
              "docs/modules/16-licm.md",
              "3. Может ли раннее выполнение породить исключение/ошибку на пути, где операция раньше не выполнялась?",
              "3. Доказано ли, что раннее выполнение не породит исключение/ошибку на пути, где операция раньше не выполнялась?",
          )

          old_effect = "Вызов считается чистым только при явной пометке pure/readonly в условии."
          new_effect = (
              "Пометка `pure` означает отсутствие чтения/записи памяти и иных эффектов по контракту; "
              "исключения проверяются отдельно. `readonly` запрещает запись, но разрешает чтение памяти "
              "и само по себе не делает вызов чистым."
          )
          replacements = 0
          for path in (ROOT / "docs").rglob("*.md"):
              text = path.read_text(encoding="utf-8")
              count = text.count(old_effect)
              if count:
                  path.write_text(text.replace(old_effect, new_effect), encoding="utf-8")
                  replacements += count
          if replacements < 10:
              raise RuntimeError(f"expected repeated effect-contract text, replaced only {replacements}")

          write(
              ".github/workflows/ci.yml",
              '''name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.11", "3.12", "3.13"]
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-python@v6
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                - name: Install package
                  run: |
                    python -m pip install --upgrade pip setuptools
                    python -m pip install -e .
                - name: Validate course structure and links
                  run: python scripts/validate_course.py
                - name: Run teaching-tool tests
                  run: python -m unittest discover -s tests -v

            documentation:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-python@v6
                  with:
                    python-version: "3.12"
                    cache: pip
                - name: Install documentation tools
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements-docs.txt
                - name: Build documentation
                  run: mkdocs build --strict
          ''',
          )

          pages = '''name: Deploy documentation

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: github-pages
            cancel-in-progress: false

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-python@v6
                  with:
                    python-version: "3.12"
                    cache: pip
                - name: Install documentation tools
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements-docs.txt
                - name: Configure Pages
                  uses: actions/configure-pages@v5
                - name: Build documentation
                  run: mkdocs build --strict --site-dir site
                - name: Upload Pages artifact
