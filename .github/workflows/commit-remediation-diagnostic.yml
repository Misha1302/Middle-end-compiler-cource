name: Capture remediation diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remediate-review-findings
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply remediation and capture checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/remediate-review.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "cat > /tmp/remediate.py <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          prefix = '          '
          Path('/tmp/remediate.py').write_text('\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in source[start:end]) + '\n', encoding='utf-8')
          PY
          python /tmp/remediate.py
          set +e
          {
            echo '== install docs =='
            python -m pip install -r requirements-docs.txt
            echo "status=$?"
            echo '== install package =='
            python -m pip install -e .
            echo "status=$?"
            echo '== validator =='
            python scripts/validate_course.py
            echo "status=$?"
            echo '== unit tests =='
            python -m unittest discover -s tests -v
            echo "status=$?"
            echo '== mkdocs =='
            mkdocs build --strict
            echo "status=$?"
          } > REMEDIATION-DIAGNOSTIC.txt 2>&1
          cat REMEDIATION-DIAGNOSTIC.txt
      - name: Commit generated state and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: capture generated remediation state"
          git push origin HEAD:agent/remediate-review-findings
