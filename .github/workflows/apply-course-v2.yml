name: Apply pedagogical course v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".remediation/final-v2.part*"
      - ".github/workflows/apply-course-v2.yml"

permissions:
  contents: write

concurrency:
  group: apply-course-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify immutable bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.remediation/final-v2.part*)
          if (( ${#parts[@]} != 8 )); then
            echo "Expected 8 bundle parts, found ${#parts[@]}" >&2
            exit 20
          fi
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/course-v2-final.tar.xz
          echo "3b678fd56daf9ad3f4336ebda86706e0de73d8e3fab024e66870f1e6e3b85d5c  /tmp/course-v2-final.tar.xz" | sha256sum -c -
          xz -t /tmp/course-v2-final.tar.xz

      - name: Validate archive boundaries and replace product tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs src tests examples scripts
          rm -f README.md NOTICE.md CONTRIBUTING.md DCO LICENSE LICENSE-CODE LICENSE-DOCS.md \
                mkdocs.yml pyproject.toml requirements-docs.txt .gitignore
          rm -f .github/workflows/ci.yml .github/workflows/pages.yml
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path('/tmp/course-v2-final.tar.xz')
          root = Path.cwd().resolve()
          with tarfile.open(archive, 'r:xz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('bundle is empty')
              for member in members:
                  logical = PurePosixPath(member.name)
                  if logical.is_absolute() or '..' in logical.parts:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  destination = (root / member.name).resolve()
                  if destination != root and root not in destination.parents:
                      raise SystemExit(f'archive escapes repository: {member.name!r}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member: {member.name!r}')
              tf.extractall(root, filter='data')
              print(f'extracted {len(members)} verified members')
          PY
          rm -rf .remediation

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Validate course pedagogy and structure
        run: python scripts/validate_course.py

      - name: Run teaching-tool tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Commit only the verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/apply-course-v2.yml'
          if git diff --cached --quiet; then
            echo "No product changes to commit." >&2
            exit 30
          fi
          git diff --cached --stat
          git commit -m "feat(course): make lessons self-contained and traceable"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
