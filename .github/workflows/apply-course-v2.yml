name: Salvage pedagogical course bundle

on:
  pull_request:
    branches: [main]
    paths:
      - ".remediation/course-v2.part*"
      - ".github/workflows/apply-course-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salvage:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'fix/pedagogical-course-v2' }}

      - name: Reconstruct available prefix
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.remediation/course-v2.part*)
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/course-v2-prefix.tar.gz
          mkdir -p /tmp/salvage
          gzip -dc /tmp/course-v2-prefix.tar.gz > /tmp/course-v2-prefix.tar 2>/tmp/gzip.err || true
          python - <<'PY'
          from pathlib import Path
          import shutil
          import tarfile

          archive = Path('/tmp/course-v2-prefix.tar')
          output = Path('/tmp/salvage').resolve()
          inventory = []
          with archive.open('rb') as stream:
              tf = tarfile.open(fileobj=stream, mode='r:')
              while True:
                  try:
                      member = tf.next()
                  except (tarfile.ReadError, EOFError) as exc:
                      inventory.append(f'STOP: {type(exc).__name__}: {exc}')
                      break
                  if member is None:
                      break
                  destination = (output / member.name).resolve()
                  if destination != output and output not in destination.parents:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'links are forbidden: {member.name!r}')
                  if member.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                      inventory.append(f'DIR  {member.name}')
                      continue
                  if not member.isfile():
                      inventory.append(f'SKIP {member.name} type={member.type!r}')
                      continue
                  source = tf.extractfile(member)
                  if source is None:
                      inventory.append(f'MISS {member.name}')
                      continue
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  try:
                      with destination.open('wb') as target:
                          shutil.copyfileobj(source, target)
                  except (tarfile.ReadError, EOFError) as exc:
                      destination.unlink(missing_ok=True)
                      inventory.append(f'PARTIAL {member.name}: {exc}')
                      break
                  inventory.append(f'FILE {member.name} {destination.stat().st_size}')
          (output / 'SALVAGE_INVENTORY.txt').write_text('\n'.join(inventory) + '\n', encoding='utf-8')
          print('\n'.join(inventory[-30:]))
          PY
          cp /tmp/gzip.err /tmp/salvage/GZIP_ERROR.txt
          cp /tmp/course-v2-prefix.tar.gz /tmp/salvage/course-v2-prefix.tar.gz

      - name: Upload salvage artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-v2-salvage
          path: /tmp/salvage
          if-no-files-found: error
          retention-days: 3
