name: Apply Russian editorial pass

on:
  pull_request:
    branches: [main]
    paths:
      - ".editorial/part*"
      - ".github/workflows/export-editorial-source.yml"

permissions:
  contents: write

concurrency:
  group: editorial-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify editorial bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.editorial/part*)
          if (( ${#parts[@]} != 9 )); then
            echo "Expected 9 bundle parts, got ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/editorial.tar.gz
          echo "c105f12c1c27547441d1835eeddb526301bd337e1cceec7681b81bfd95e1b475  /tmp/editorial.tar.gz" | sha256sum -c -
          gzip -t /tmp/editorial.tar.gz

      - name: Safely extract bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = Path('/tmp/editorial.tar.gz')
          root = Path.cwd().resolve()
          allowed_roots = {'README.md', 'docs', 'scripts', 'tests'}
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('bundle is empty')
              for member in members:
                  normalized = member.name.removeprefix('./')
                  if not normalized:
                      continue
                  first = normalized.split('/', 1)[0]
                  if first not in allowed_roots:
                      raise SystemExit(f'path outside editorial allowlist: {member.name!r}')
                  destination = (root / normalized).resolve()
                  if destination != root and root not in destination.parents:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'links are forbidden: {member.name!r}')
              tf.extractall(root, filter='data')
          PY
          rm -rf .editorial

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Validate language, structure and links
        run: python scripts/validate_course.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Build documentation strictly
        run: mkdocs build --strict --site-dir site

      - name: Upload rendered site for visual review
        uses: actions/upload-artifact@v4
        with:
          name: editorial-rendered-site
          path: site
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified editorial changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs scripts/validate_course.py tests/test_course_validator.py
          git add -u .editorial || true
          if git diff --cached --quiet; then
            echo "No editorial changes to commit."
            exit 0
          fi
          git commit -m "docs: simplify Russian language across the course"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
