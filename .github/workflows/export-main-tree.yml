name: Export main tree identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record revision identities
        run: |
          git rev-parse HEAD > main-commit.txt
          git rev-parse 'HEAD^{tree}' > main-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: main-tree-identity
          path: |
            main-commit.txt
            main-tree.txt
          retention-days: 1
