name: Export current editorial branch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-language-polish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/russian-language-readability
      - name: Export product tree
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.polish --exclude=.github/workflows/final-language-polish.yml -czf /tmp/current-editorial-product.tar.gz .
          sha256sum /tmp/current-editorial-product.tar.gz > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: current-editorial-product
          path: |
            /tmp/current-editorial-product.tar.gz
            /tmp/SHA256SUMS
          retention-days: 2
