name: Apply final Russian polish

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-language-polish.yml"
      - ".tmp/apply_final_polish.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact editorial replacements
        run: python .tmp/apply_final_polish.py
      - name: Remove temporary transfer files
        run: rm -rf .polish .tmp
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt
      - name: Validate and test
        run: |
          python scripts/validate_course.py
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          mkdocs build --strict --site-dir site
      - name: Commit verified final polish
        run: |
          set -euo pipefail
          rm -rf site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git add -u .polish .tmp || true
          git commit -m "docs: remove remaining Russian calques and typos"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
