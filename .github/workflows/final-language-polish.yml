name: Apply final Russian polish

on:
  pull_request:
    branches: [main]
    paths:
      - ".polish/tail05"
      - ".github/workflows/final-language-polish.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify stored bundle chunks
        run: |
          set -euo pipefail
          echo "85743b7d5142c5d608f70eb3e60665f00fe3d53751a0b119136b86b5856cf79a  .polish/part00" | sha256sum -c -
          echo "f15f1865bf7a7138088bf6e1a2333834dc67ed2fe2a05a61e0ea69310fa92a87  .polish/part01" | sha256sum -c -
          echo "39f60428ab1aeec662e86b5efe37d9146204bd64f2027f2dd7093a0781eb8947  .polish/tail00" | sha256sum -c -
          echo "275d60fb1769dfd6e36a6383a88125d030dcb8959a7f5bd6f304c010aab34a1c  .polish/tail01" | sha256sum -c -
          echo "ec15a5858a9d31e28c304649fa0b4be3b79696c8bcb3ff125c866449c1f46222  .polish/tail02" | sha256sum -c -
          echo "94a1961885ff76a2276893f7b0ed851ca3ed5cab6028c3dfe215f23b4c1cf0b3  .polish/tail03" | sha256sum -c -
          echo "eec50608aa8fb87368f88dce95db5d200c9280f9dc5e5a9268958f46dfbb8a6b  .polish/tail04" | sha256sum -c -
          echo "f89f3a8020a1b4c5ba6a0c635b4899794598fe84a7d1fb6f452bc4d067f0d91b  .polish/tail05" | sha256sum -c -

      - name: Reconstruct and verify bundle
        run: |
          set -euo pipefail
          cat .polish/part00 .polish/part01 .polish/tail00 .polish/tail01 .polish/tail02 .polish/tail03 .polish/tail04 .polish/tail05 | base64 --decode > /tmp/final-polish.tar.gz
          echo "e0bc7a0b7cb29a67c62c1391729b7a558bc1dda1344de180c88984633ca87e10  /tmp/final-polish.tar.gz" | sha256sum -c -
          gzip -t /tmp/final-polish.tar.gz

      - name: Extract allowlisted files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile
          allowed = {'README.md','docs/modules/05-idom-tree-and-df.md','docs/modules/12-checkpoint-1.md','docs/modules/14-havlak-and-loop-tree.md','docs/modules/19-mock-exam-1.md','docs/modules/20-final-repair.md','docs/course-map.md','docs/practice/transfer-bank.md','docs/resources/glossary.md','docs/resources/flashcards.md'}
          root = Path.cwd().resolve()
          with tarfile.open('/tmp/final-polish.tar.gz', 'r:gz') as tf:
              members = tf.getmembers()
              names = {m.name.removeprefix('./') for m in members if m.isfile()}
              if names != allowed:
                  raise SystemExit(f'unexpected bundle files: {sorted(names ^ allowed)}')
              for member in members:
                  name = member.name.removeprefix('./')
                  if name in {'', '.'}:
                      continue
                  destination = (root / name).resolve()
                  if root not in destination.parents or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe member: {member.name!r}')
              tf.extractall(root, filter='data')
          PY
          rm -rf .polish

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt
      - name: Validate and test
        run: |
          python scripts/validate_course.py
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          mkdocs build --strict --site-dir site
      - name: Commit verified polish
        run: |
          set -euo pipefail
          rm -rf site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git add -u .polish || true
          git commit -m "docs: remove remaining Russian calques and typos"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
