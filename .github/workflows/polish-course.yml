name: Polish generated course content

on:
  push:
    branches:
      - agent/publish-middle-end-course
    paths:
      - ".quality-fix.trigger"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/publish-middle-end-course
          fetch-depth: 0

      - name: Remove conversion artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          markdown_files = [root / "README.md", *sorted((root / "docs").rglob("*.md"))]
          replacements = {
              "## Сегодняшний результат": "## Результат занятия",
              "Разобрать со мной уменьшенный пример; B можно закончить второй сессией.": "Разобрать уменьшенный пример с преподавателем или свериться с эталоном; B можно закончить во второй сессии.",
              "Не читать дальше; прислать попытку после 10–15 минут.": "Не переходить дальше; зафиксировать попытку и запросить разбор после 10–15 минут.",
              "После завершения разрешён разбор со мной.": "После завершения разрешён разбор по эталонам или с преподавателем.",
              "во время разбора со мной": "во время разбора с преподавателем",
              "затем перерыв и разбор со мной.": "затем перерыв и разбор по эталонам или с преподавателем.",
          }

          for path in markdown_files:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r"(?m)^(\d+)\.\s+\1\\\.\s+", r"\1. ", text)
              path.write_text(text, encoding="utf-8")

          havlak = root / "docs/modules/14-havlak-and-loop-tree.md"
          text = havlak.read_text(encoding="utf-8")
          text = text.replace(
              "| **Разрешённый режим.** К зачёту сначала пойми идею и трассу; каноническая статья или спецификация курса имеет приоритет. |",
              "| **Уровень точности.** Занятие фиксирует инварианты и фазы Хавлака, но не выдаёт учебную схему за готовую промышленную реализацию. |",
          )
          text = text.replace(
              "| **В этом занятии не требуется.** Не заучивай псевдокод по памяти до получения канонической статьи или спецификации курса. |",
              "| **В этом занятии не требуется.** Не заучивай псевдокод построчно: требуется уметь восстановить состояния DFS, worklist, Union-Find и loop tree. |",
          )
          text = text.replace(
              "Алгоритм Хавлака строит loop nesting tree для произвольного CFG и расширяет идеи Тарьяна на несводимые области. В irreducible CFG конкретное дерево может зависеть от выбранного DFS spanning tree. Для зачёта терминология и точный вариант канонической статьи или спецификации курса имеют приоритет над этим учебным изложением.",
              "Алгоритм Хавлака строит loop nesting tree для произвольного CFG и расширяет идеи Тарьяна на несводимые области. В irreducible CFG конкретное дерево может зависеть от выбранного DFS spanning tree. При переносе в код зафиксируй вариант классификации рёбер, представление Union-Find и правила построения loop tree, а затем сверь их с канонической статьёй Хавлака из раздела источников.",
          )
          havlak.write_text(text, encoding="utf-8")

          status = root / "docs/course-status.md"
          text = status.read_text(encoding="utf-8")
          text = text.replace(
              "- Алгоритм Хавлака изложен как учебная схема. Для промышленной реализации необходимо сверяться с канонической статьёй и выбранной спецификацией данных/классификации циклов.",
              "- Алгоритм Хавлака разобран на уровне инвариантов, фаз и трассы. Полная production-ready реализация остаётся отдельной лабораторной и должна фиксировать конкретный вариант классификации и структуры данных.",
          )
          status.write_text(text, encoding="utf-8")

          validator = root / "scripts/validate_course.py"
          text = validator.read_text(encoding="utf-8")
          text = text.replace(
              '    "Работа со мной",\n',
              '    "Работа со мной",\n    "разбор со мной",\n    "Разобрать со мной",\n    "прислать попытку",\n    "до получения канонической статьи",\n',
          )
          text = text.replace(
              '        validate_links(path, text, errors)\n',
              '        if re.search(r"(?m)^\\d+\\.\\s+\\d+\\\\\\.\\s+", text):\n            errors.append(f"{path.relative_to(ROOT)}: duplicated ordered-list numbering")\n        validate_links(path, text, errors)\n',
          )
          validator.write_text(text, encoding="utf-8")
          PY
          rm -f .quality-fix.trigger

      - name: Verify repaired course
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/validate_course.py
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Commit content repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove generated course conversion artifacts"
          git push origin HEAD:agent/publish-middle-end-course
