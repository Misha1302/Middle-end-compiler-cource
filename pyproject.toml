[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "middle-end-compiler-course"
version = "0.1.0"
description = "Teaching utilities for a middle-end compiler course"
requires-python = ">=3.11"
authors = [{name = "Mikhail Razakov"}]

[project.scripts]
course-cfg = "middle_end_course.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
